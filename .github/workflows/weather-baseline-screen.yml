name: Weather Baseline Screen

on:
  workflow_dispatch:
  push:
    branches:
      - codex/weather-backtest-tournament
    paths:
      - .github/workflows/weather-baseline-screen.yml

jobs:
  screen_day:
    name: screen-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {label: apr15, start: '2026-04-15T12:00Z', end: '2026-04-16T12:00Z'}
          - {label: apr22, start: '2026-04-22T12:00Z', end: '2026-04-23T12:00Z'}
          - {label: apr29, start: '2026-04-29T12:00Z', end: '2026-04-30T12:00Z'}
          - {label: may06, start: '2026-05-06T12:00Z', end: '2026-05-07T12:00Z'}
          - {label: may13, start: '2026-05-13T12:00Z', end: '2026-05-14T12:00Z'}
          - {label: may20, start: '2026-05-20T12:00Z', end: '2026-05-21T12:00Z'}
          - {label: may27, start: '2026-05-27T12:00Z', end: '2026-05-28T12:00Z'}
          - {label: jun03, start: '2026-06-03T12:00Z', end: '2026-06-04T12:00Z'}
          - {label: jun10, start: '2026-06-10T12:00Z', end: '2026-06-11T12:00Z'}
          - {label: jun17, start: '2026-06-17T12:00Z', end: '2026-06-18T12:00Z'}
          - {label: jun24, start: '2026-06-24T12:00Z', end: '2026-06-25T12:00Z'}
          - {label: jul01, start: '2026-07-01T12:00Z', end: '2026-07-02T12:00Z'}
          - {label: jul08, start: '2026-07-08T12:00Z', end: '2026-07-09T12:00Z'}
          - {label: jul15, start: '2026-07-15T12:00Z', end: '2026-07-16T12:00Z'}
          - {label: jul22, start: '2026-07-22T12:00Z', end: '2026-07-23T12:00Z'}
          - {label: jul29, start: '2026-07-29T12:00Z', end: '2026-07-30T12:00Z'}
          - {label: aug05, start: '2026-08-05T12:00Z', end: '2026-08-06T12:00Z'}
          - {label: aug12, start: '2026-08-12T12:00Z', end: '2026-08-13T12:00Z'}
          - {label: aug19, start: '2026-08-19T12:00Z', end: '2026-08-20T12:00Z'}
          - {label: aug26, start: '2026-08-26T12:00Z', end: '2026-08-27T12:00Z'}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Build one-day weather-only pmxt slice
        run: |
          python scripts/build_pmxt_weather_cache.py \
            --start '${{ matrix.start }}' \
            --end '${{ matrix.end }}' \
            --refresh-manifest
      - name: Replay blind-NO grid
        run: |
          python scripts/backtest_pmxt_blind_no.py \
            --out 'research/results/panel/${{ matrix.label }}' \
            --min-events 1 \
            --min-dates 1 \
            --min-stations 1 \
            --region us
      - name: Upload per-date trades and ranking
        uses: actions/upload-artifact@v4
        with:
          name: blind-no-${{ matrix.label }}
          path: research/results/panel/${{ matrix.label }}
          retention-days: 7

  aggregate:
    name: aggregate-screen
    needs: screen_day
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Download screening artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: blind-no-*
          path: panel_artifacts
      - name: Aggregate with production research gates
        run: |
          python scripts/aggregate_pmxt_blind_no_panel.py \
            --root panel_artifacts \
            --out research/results/pmxt_blind_no_panel \
            --min-events 30 \
            --min-dates 20 \
            --min-stations 3
          echo '--- screening ranking ---'
          cat research/results/pmxt_blind_no_panel/ranking.csv
      - name: Upload aggregate ranking
        uses: actions/upload-artifact@v4
        with:
          name: blind-no-screen-aggregate
          path: research/results/pmxt_blind_no_panel
          retention-days: 14
