name: Stayton Contrails Now

on:
  workflow_dispatch:
  push:
    branches:
      - integration/weather-alpha-unified
    paths:
      - .github/workflows/stayton-contrails-now.yml

jobs:
  stayton:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CONTRAILS_API_KEY: ${{ secrets.GOOGLE_CONTRAILS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify secret presence
        run: |
          if [ -z "$GOOGLE_CONTRAILS_API_KEY" ]; then
            echo "GOOGLE_CONTRAILS_API_KEY secret is not configured in GitHub Actions."
            exit 2
          fi
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Pull current Stayton contrails
        run: |
          python scripts/report_stayton_contrails_today.py             --output stayton_contrails_today.json
      - name: Display report
        run: cat stayton_contrails_today.json
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stayton-contrails-today
          path: stayton_contrails_today.json
          retention-days: 3
