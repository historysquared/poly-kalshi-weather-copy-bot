[project]
name = "weather-alpha-lab"
version = "0.2.0"
description = "Kalshi/Polymarket weather alpha research, backtest, paper and guarded live-trading engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "duckdb>=1.1",
  "cryptography>=43.0",
  "xarray>=2024.7",
  "netcdf4>=1.7",
  "h5netcdf>=1.3",
  "pyproj>=3.6",
  "boto3>=1.35",
  "botocore>=1.35",
  "s3fs>=2024.6",
  "cfgrib>=0.9.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["weather_alpha*"]

[tool.pytest.ini_options]
pythonpath = ["."]
